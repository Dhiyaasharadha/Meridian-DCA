[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "contracts/test"
script = "contracts/script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
  "forge-std/=lib/forge-std/src/"
]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
